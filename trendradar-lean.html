  function balancedSplit(n, L) {
    var base = Math.floor(n / L), extra = n % L, out = [];
    for (var j = 0; j < L; j++) out.push(base + (j < extra ? 1 : 0));
    return out;
  }


  


















  function chooseLanes(n, r0, r1, span, blip, gap) {
    var depth = Math.max(1e-6, r1 - r0);
    var step = blip + gap;
    var maxLanes = Math.max(1, Math.min(n, Math.floor(depth / step)));
    var best = null, L, j;

    function evaluate(L) {
      var laneDepth = depth / L;
      var counts = balancedSplit(n, L);
      var feasible = true, rMean = 0, capacity = 0;
      for (j = 0; j < L; j++) {
        var rMid = r0 + (j + 0.5) * laneDepth;
        var cap = Math.floor((span * rMid) / step);
        capacity += cap;
        if (counts[j] > cap) feasible = false;
        rMean += rMid;
      }
      var arcGap = (span * (rMean / L)) / (n / L);
      return {
        L: L, laneDepth: laneDepth, off: 0, counts: counts, feasible: feasible,
        capacity: capacity, score: Math.abs(Math.log(arcGap / laneDepth))
      };
    }

    for (L = 1; L <= maxLanes; L++) {
      var cand = evaluate(L);
      if (cand.feasible && (!best || cand.score < best.score - 1e-9)) best = cand;
    }
    if (best) return best;

    

    var tight = evaluate(maxLanes);
    tight.feasible = false;
    return tight;
  }

  function placeGroup(g, band, delta, blip, pick) {
    var a0 = g.sector ? g.sector.index * delta : 0;
    var out = [], k = 0;
    for (var j = 0; j < pick.counts.length; j++) {
      var count = pick.counts[j];
      var r = band.r0 + pick.off + (j + 0.5) * pick.laneDepth;
      for (var sIdx = 0; sIdx < count; sIdx++) {
        var a = a0 + (sIdx + 0.5) * delta / count;
        out.push({
          entry: g.entries[k++],
          x: r * Math.sin(a),
          y: -r * Math.cos(a),
          r: blip / 2,
          angle: a,
          radius: r
        });
      }
    }
    return out;
  }

  

  function placeAll(norm, groups, R, blip, gap) {
    var nR = norm.rings.length;
    var nS = norm.sectors.length;
    var delta = nS ? TAU / nS : TAU;
    var pitch = R / nR;
    var pad = blip / 2 + gap / 2;

    var bands = norm.rings.map(function (ring, i) {
      return { ring: ring, index: i, r0: i * pitch + pad, r1: (i + 1) * pitch - pad, boundary: (i + 1) * pitch };
    });

    var wedges = [];
    if (nS) {
      norm.sectors.forEach(function (sector) {
        wedges.push({ sector: sector, index: sector.index, a0: sector.index * delta, a1: (sector.index + 1) * delta });
      });
    } else {
      wedges.push({ sector: null, index: 0, a0: 0, a1: TAU });
    }

    var blips = [];
    var ok = true;
    var worst = null;
    groups.forEach(function (g) {
      var band = bands[g.ring.index];
      

      var span = g.sector ? delta : TAU;
      var pick = chooseLanes(g.entries.length, band.r0, band.r1, span, blip, gap);
      if (!pick.feasible) {
        ok = false;
        var ratio = g.entries.length / Math.max(1, pick.capacity);
        if (!worst || ratio > worst.ratio) worst = { g: g, n: g.entries.length, capacity: pick.capacity, ratio: ratio };
      }
      var placed = placeGroup(g, band, span, blip, pick);
      placed.forEach(function (p) {
        p.ring = g.ring;
        p.sector = g.sector;
        blips.push(p);
      });
    });

    




    var minDist = Infinity;
    for (var i = 0; i < blips.length; i++) {
      for (var k = i + 1; k < blips.length; k++) {
        var dd = Math.hypot(blips[i].x - blips[k].x, blips[i].y - blips[k].y);
        if (dd < minDist) minDist = dd;

    }
    if (blips.length < 2) minDist = blip;
    if (minDist < blip - 1e-6) ok = false;

    return {

      pitch: pitch, R: R, worst: worst, minDist: minDist

  }


  

  function computeLayout(raw) {
    var norm = raw && raw.rings ? raw : validate(raw);
    var size = norm.layout.size;
    var blip = size.blip, gap = size.gap;
    var warnings = norm.warnings.slice();

    
    var entries = norm.entries.slice().sort(function (a, b) {
    });
    entries.forEach(function (e, i) { e.number = i + 1; });

    






    var groups = [];
    norm.rings.forEach(function (ring) {
      var here = entries.filter(function (e) { return e.ringIndex === ring.index; });
      if (!norm.sectors.length) {
        if (here.length) groups.push({ ring: ring, sector: null, entries: here });
        return;
      }
      var buckets = norm.sectors.map(function (s) { return { ring: ring, sector: s, entries: [] }; });
      here.filter(function (e) { return !e.sector; }).forEach(function (e) {
        
        var target = buckets.reduce(function (a, b) { return b.entries.length < a.entries.length ? b : a; });
        target.entries.push(e);
      });
      here.filter(function (e) { return !!e.sector; }).forEach(function (e) {
        buckets[e.sector.index].entries.push(e);
      });
      buckets.forEach(function (b) { if (b.entries.length) groups.push(b); });
    });

    
    var R = size.mode === "fixed" ? size.radius : size.min;
    var geo = null, guard = 0, overflow = false;
    while (guard++ < 40) {
      geo = placeAll(norm, groups, R, blip, gap);
      if (geo.ok) break;
      if (size.mode === "fixed") { overflow = true; break; }
      var next = Math.min(R * 1.12, size.max);
      if (next <= R + 0.5) {
        R = size.max;
        geo = placeAll(norm, groups, R, blip, gap);
        overflow = !geo.ok;
        break;
      }
      R = next;
    }
    if (overflow) {
      


      var needR = null;
      if (size.mode !== "fixed") {
        for (var probe = size.max * 1.02, steps = 0; probe < 4000 && steps < 220; probe *= 1.02, steps++) {
          if (placeAll(norm, groups, probe, blip, gap).ok) { needR = probe; break; }
        }
      }
      var where = geo.worst
        ? "Ring \"" + geo.worst.g.ring.name + "\"" + (geo.worst.g.sector ? " / Sektor \"" + geo.worst.g.sector.name + "\"" : "") +
          " braucht allein " + geo.worst.n + " Plätze, es passen " + geo.worst.capacity + "."
        : "";
      var need = needR
        ? "Ab Radius " + Math.ceil(needR) + " wäre alles überlappungsfrei – setze \"layout.size.max\" entsprechend."
        : "Auch bei einem sehr großen Radius reicht der Platz nicht.";
      

      if (needR && needR > size.max * 2.2) {
        need += " Achtung: Bei so großem Radius sind die Blips nur noch " +
          Math.round(blip * 500 / needR) + " px breit (in einem 500 px hohen Rahmen). " +
          "Besser ist es, \"layout.size.blip\" zu verkleinern, einen weiteren Ring anzulegen " +
          "oder auf Sektoren zu verzichten.";
      }
      warnings.push(
        "Überfüllt: Bei Radius " + Math.round(size.max) + " passen nicht alle Blips ohne Überlappung " +
        "(geringster Abstand " + geo.minDist.toFixed(1) + " statt " + blip + "). " + where + " " + need
      );
    }

    
    var t = norm.theme;
    var labelSize = nOf(t.sectorLabelSize, 13, 8, 40);
    var labelR = R + Math.max(10, labelSize * 0.9);
    var labels = [];
    if (t.showSectorLabels && geo.nS >= 3) {
      geo.wedges.forEach(function (w) {
        if (!w.sector) return;
        var chord = 2 * labelR * Math.sin(Math.min(geo.delta, Math.PI) / 2);
        var maxChars = Math.floor(chord / (labelSize * 0.55));
        if (maxChars < 3) return;
        var name = w.sector.name;
        var shown = name.length > maxChars ? name.slice(0, Math.max(1, maxChars - 1)) + "\u2026" : name;
        var mid = (w.a0 + w.a1) / 2;
        var x = labelR * Math.sin(mid), y = -labelR * Math.cos(mid);
        labels.push({ name: name, text: shown, x: x, y: y, truncated: name.length > maxChars });
      });
    }
    if (labels.length && labels[0].truncated) {
      warnings.push("Sektor-Namen am Rand sind gekürzt. Die vollständigen Namen stehen in der Legende.");
    }

    var half = R + 10;
    labels.forEach(function (l) {
      half = Math.max(half, Math.abs(l.x) + l.text.length * labelSize * 0.3, Math.abs(l.y) + labelSize * 0.7);
    });
    var W = 2 * half;
    

    var vb = function (v) { return Math.round(v * 100) / 100; };

    

    geo.blips.sort(function (a, b) { return a.entry.number - b.entry.number; });

    return {
      meta: norm.meta,
      theme: norm.theme,
      layout: norm.layout,
      links: norm.links,
      size: { blip: blip, gap: gap, radius: R, mode: size.mode, numberFont: blip * 0.52 },
      radius: R,
      pitch: geo.pitch,
      delta: geo.delta,
      


      minDist: geo.minDist,

      "--tr-font": theme.font,
      "--tr-head-font": theme.headFont,
      "--tr-font-size": theme.fontSize + "px",
      "--tr-blip-stroke": theme.blipStroke,
      "--tr-blip-stroke-width": theme.blipStrokeWidth + "px"
    };
  }

  


  function themeVarText(theme) {
    var v = cssVars(theme), out = "";
    Object.keys(v).forEach(function (k) { out += k + ":" + v[k] + ";"; });
    return out;
  }

  function mount(root, rawData) {
    if (!root) return null;
    var doc = root.ownerDocument || (typeof document !== "undefined" ? document : null);
    var win = doc && doc.defaultView ? doc.defaultView : (typeof window !== "undefined" ? window : null);
    var norm = validate(rawData);
    norm.warnings.forEach(function (w) { if (typeof console !== "undefined") console.warn("[Trendradar] " + w); });

    if (norm.errors.length) {
      var box = doc.createElement("div");
      box.innerHTML = renderErrorHTML(norm.errors, norm.warnings);
      while (root.firstChild) root.removeChild(root.firstChild);
      root.appendChild(box.firstChild);
      return null;
    }

    var layout = computeLayout(norm);

    


    if (doc && doc.body && layout.theme && layout.theme.background) {
      doc.body.style.background = layout.theme.background;
    }

    if (layout.overflow && typeof console !== "undefined") {
      console.warn("[Trendradar] " + layout.warnings[layout.warnings.length - 1]);
    }

    var head = root.querySelector(".tr-head");
    var stage = root.querySelector(".tr-stage");
    var legendWrap = root.querySelector(".tr-legend-wrap");
    var toolbar = root.querySelector(".tr-toolbar");
    var legendBox = root.querySelector(".tr-legend");

    


    if (head) head.style.cssText = S.head;
    if (stage) stage.style.cssText = S.stage;
    if (toolbar) toolbar.style.cssText = S.toolbar;
    if (legendBox) legendBox.style.cssText = S.legend;

    head.innerHTML = renderHeadHTML(layout);
    stage.innerHTML = renderSVG(layout);

    var mode = norm.layout.legend.mode;

    function paintLegend() {
      legendBox.innerHTML = renderLegendHTML(layout, mode);
      if (toolbar) {
        Array.prototype.forEach.call(toolbar.querySelectorAll(".tr-btn"), function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === mode ? "true" : "false");
        });
      }
      wireHighlight();
    }

    
    function wireHighlight() {
      var map = {};
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip"), function (g) {
        map[g.getAttribute("data-nr")] = g;
      });
      Array.prototype.forEach.call(legendBox.querySelectorAll(".tr-row"), function (row) {
        function on() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.add("is-hl"); }
        function off() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.remove("is-hl"); }
        row.addEventListener("mouseenter", on);
        row.addEventListener("mouseleave", off);
      });
    }

    
    if (toolbar) {
      toolbar.style.cssText = S.toolbar;
      toolbar.innerHTML = '<span style="' + S.muted + ';font-size:0.85em;margin-right:auto">Legende</span>' +
        '<button type="button" class="tr-btn" data-mode="grouped">Gruppiert</button>' +
        '<button type="button" class="tr-btn" data-mode="flat">Flach</button>';
      toolbar.addEventListener("click", function (ev) {
        var btn = ev.target.closest ? ev.target.closest(".tr-btn") : null;
        if (!btn) return;
        mode = btn.getAttribute("data-mode") === "flat" ? "flat" : "grouped";
        paintLegend();
      });
    }

    





    paintLegend();

    


    root.style.cssText = S.root + "border-radius:" + norm.theme.radius + "px";
    if (legendWrap) legendWrap.style.cssText = S.wrap;

    

    var vars = cssVars(norm.theme);
    Object.keys(vars).forEach(function (k) { root.style.setProperty(k, vars[k]); });

    











    var ZIEL_LABEL = 13, ZIEL_NR = 11.4, ZIEL_BLIP = 15, MIN_LABEL = 9;

    
    function blipBoxes() {
      var out = [];
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip circle"), function (c) {
        var b = c.getBoundingClientRect();
        out.push({ l: b.left, t: b.top, r: b.right, b: b.bottom });
      });
      return out;
    }

    function labelFits(t, boxes) {
      var b = t.getBoundingClientRect();
      var m = 3;
      for (var i = 0; i < boxes.length; i++) {
        var x = boxes[i];
        if (b.left < x.r + m && b.right > x.l - m &&
            b.top < x.b + m && b.bottom > x.t - m) return false;
      }
      return true;
    }

    









    function viewBoxFuerLabels(svg) {
      var vb = svg.viewBox.baseVal;
      if (!vb || !vb.width) return false;
      var mitteX = vb.x + vb.width / 2, mitteY = vb.y + vb.height / 2;
      var nX = vb.width / 2, nY = vb.height / 2, zuKlein = false;
      Array.prototype.forEach.call(svg.querySelectorAll("text.tr-sector-label"), function (t) {
        if (t.style.display === "none") return;
        var bb = null;
        try { bb = t.getBBox(); } catch (e) { return; }
        if (!bb || !bb.width) return;
        var l = mitteX - bb.x, r = bb.x + bb.width - mitteX;
        var o = mitteY - bb.y, u = bb.y + bb.height - mitteY;
        if (l > nX || r > nX || o > nY || u > nY) zuKlein = true;
        nX = Math.max(nX, l, r);
        nY = Math.max(nY, o, u);
      });
      if (!zuKlein) return false;
      

      nX += 6; nY += 6;
      svg.setAttribute("viewBox",
        (mitteX - nX).toFixed(2) + " " + (mitteY - nY).toFixed(2) + " " +
        (nX * 2).toFixed(2) + " " + (nY * 2).toFixed(2));
      return true;
    }

    function fitText() {
      var svg = stage.querySelector("svg");
      if (!svg || typeof svg.getScreenCTM !== "function") return;
      var m = svg.getScreenCTM();
      var k = m && m.a ? 1 / m.a : 1;
      if (!isFinite(k) || k <= 0) return;
      if (Math.abs(k - (fitText.last || 0)) < 0.02) return;
      fitText.last = k;

      





      var dUser = layout.size.blip;
      var istPx = dUser / k;
      var maxF = layout.minDist > 0 ? layout.minDist / dUser : 1;
      var f = Math.min(maxF, Math.max(1, ZIEL_BLIP / istPx));
      if (!isFinite(f) || f <= 0) f = 1;

      if (Math.abs(f - (fitText.lastF || 0)) > 0.01) {
        fitText.lastF = f;
        Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip circle"), function (c) {
          if (!c.getAttribute("data-r")) c.setAttribute("data-r", c.getAttribute("r"));
          c.setAttribute("r", (parseFloat(c.getAttribute("data-r")) * f).toFixed(2));
        });
        

        Array.prototype.forEach.call(stage.querySelectorAll(".tr-sectorline"), function (l) {
          if (!l.getAttribute("data-x1")) {
            l.setAttribute("data-x1", l.getAttribute("x1"));
            l.setAttribute("data-y1", l.getAttribute("y1"));
          }
          l.setAttribute("x1", (parseFloat(l.getAttribute("data-x1")) * f).toFixed(2));
          l.setAttribute("y1", (parseFloat(l.getAttribute("data-y1")) * f).toFixed(2));
        });
      }

      



      var innenPx = Math.max(0, (dUser * f) / k - 4);
      var nrPx = Math.min(ZIEL_NR, innenPx / 0.6);
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip-nr"), function (t) {
        t.style.fontSize = (nrPx * k).toFixed(2) + "px";
      });

      




      var boxes = blipBoxes();
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-sector-label"), function (t) {
        t.style.display = "";
        var px = ZIEL_LABEL;
        t.style.fontSize = (px * k).toFixed(2) + "px";
        while (px > MIN_LABEL && !labelFits(t, boxes)) {
          px = Math.max(MIN_LABEL, px - 0.5);
          t.style.fontSize = (px * k).toFixed(2) + "px";
        }
        if (!labelFits(t, boxes)) t.style.display = "none";
      });

      



      root.style.setProperty("--tr-blip-stroke-width", (1.5 * k).toFixed(2) + "px");
      root.style.setProperty("--tr-blip-stroke-hover", (3.5 * k).toFixed(2) + "px");

      




      if (viewBoxFuerLabels(svg)) {
        fitText.durchlaeufe = (fitText.durchlaeufe || 0) + 1;
        if (fitText.durchlaeufe < 3) {
          fitText.last = 0;
          fitText.lastF = 0;
          return fitText();
        }
      }
      fitText.durchlaeufe = 0;
    }

    fitText();
    if (win && typeof win.ResizeObserver === "function" && stage) {
      

      var ro = new win.ResizeObserver(fitText);
      ro.observe(stage);
    }
    if (win && win.addEventListener) {
      


      win.addEventListener("resize", fitText);
    }

    return layout;
  }

  function readEmbeddedData(doc) {
    var el = doc.getElementById("trendradar-data");
    if (!el) return null;
    try {
      return JSON.parse(el.textContent || el.innerText || "{}");
    } catch (err) {
      if (typeof console !== "undefined") console.error("[Trendradar] JSON-Block ist ungültig: " + err.message);
      return { __parseError: err.message };
    }
  }

  function autoInit(doc) {
    doc = doc || (typeof document !== "undefined" ? document : null);
    if (!doc) return null;
    var root = doc.querySelector(".tr-root");
    if (!root) return null;
    var data = readEmbeddedData(doc);
    if (data && data.__parseError) {
      root.innerHTML = renderErrorHTML(["Der JSON-Block \"trendradar-data\" ist nicht gültiges JSON: " + data.__parseError], []);
      return null;
    }
    return mount(root, data);
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { autoInit(); });
    else autoInit();
  }

  return {
    TAU: TAU,
    STYLE: S,
    validate: validate,
    computeLayout: computeLayout,
    renderSVG: renderSVG,
    renderLegendHTML: renderLegendHTML,
    renderHeadHTML: renderHeadHTML,
    renderErrorHTML: renderErrorHTML,
    cssVars: cssVars,
    themeVarText: themeVarText,
    mount: mount,
    autoInit: autoInit,
    readEmbeddedData: readEmbeddedData
  };
})();

if (typeof globalThis !== "undefined") globalThis.TrendRadar = TrendRadar;
if (typeof module !== "undefined" && module.exports) module.exports = TrendRadar;
</script>
