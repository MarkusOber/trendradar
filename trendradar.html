<!doctype html>
<!--
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  TRENDRADAR
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─

  1. Kopieren. Fertig. Die Datei laeuft per Doppelklick, per <iframe src> und
     auf jedem statischen Hosting. Kein Server, kein Build, keine Abhaengigkeit.

  2. Alles Anpassbare steht im JSON-Block weiter unten ("trendradar-data").
     Nur diesen Block aendern - der Rest der Datei bleibt unangetastet.

  3. Fuer eine Umgebung ohne JavaScript (z. B. iFrame mit sandbox ohne
     allow-scripts, oder ein CMS, das <script> entfernt):

        node build.js trendradar.html -o radar.html

     Das Ergebnis ist eine statische Datei ohne einen einzigen <script> und
     ohne <style>. Beide Wege nutzen exakt dieselbe Layout-Engine.

  4. Die Datei fuellt ihren Rahmen aus: sie ist so hoch wie das Sichtfenster,
     der Radar nimmt den quadratischen Platz darin ein, die Legende steht
     darunter und scrollt intern. Die Seite selbst scrollt nicht. Im <iframe>
     also eine Hoehe mitgeben, sonst stuetzt sich der Inhalt auf die Hoehe
     des iframes:

        <iframe src="radar.html" style="width:100%;height:720px;border:0"></iframe>

  ─  ─ SCHEMA (nur Pflichtfelder sind markiert, alles andere ist optional)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
    "schemaVersion": 1,          // nur hochzaehlen bei NEUEN (additiven) Feldern
    "subtitle":    "Optionaler Untertitel.",
    "date":        "2026-09-29",

    "links":  { "target": "_blank" },     // "_blank" | "_self"  = Vorgabe

    "layout": {
      "legend": { "mode": "grouped" },   // "grouped" | "flat"  (umschaltbar)
                                         // Die Legende liegt immer unter dem
                                         // Radar und scrollt fuer sich.
      "size":   { "mode": "auto",         // "auto" = waechst bis alles passt
                  "min": 380,             // "fixed" = Radius fest
                  "max": 660,             // Obergrenze für "auto"
                  "radius": 480,          // Radius für "fixed"
                  "blip": 22,             // Blip-Durchmesser in SVG-Einheiten
                  "gap": 4 }              // Mindestabstand zwischen Blips
    },

    "theme": {                 // jede Farbe auch als CSS-Variable überschreibbar
      "background": "#ffffff", "ink": "#111111", "muted": "#6b7280",
      "grid": "#e6e6e6", "sectorLine": "#cfcfcf", "border": "#e8e8e8",
      "font": "system-ui, sans-serif", "fontSize": 14, "headSize": 21,
      "sectorLabelSize": 13, "showSectorLabels": true
    },

    "rings":   [               // 3-6 Ringe, REIHENFOLGE = Zentrum -> Rand
      { "id": "adopt", "name": "ADOPT", "color": "#2e7d32",
        "description": "Wird breit genutzt, wir investieren langfristig." }
    ],

    "sectors": [               // optional. [] = nur Ringe, ohne Tortenstuecke
      { "id": "tech", "name": "Technologie" }
    ],

    "entries": [               // 10-40 Trends
      { "name": "Pflicht",                    // Pflicht
        "ring": "adopt",                     // Pflicht: muss eine ring-id sein
        "sector": "tech",                    // optional: muss eine sector-id sein
        "description": "Optional",           // optional
        "target": "_self",                   // optional: "_blank" | "_self"
        "url": "https://example.com/trend"   // optional
      }
    ]
  }
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─

  ─  ─ REGELN, DIE DIE ENGINE GARANTIERT (man muss sich nicht darum kümmern)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  · Trends werden global 1..N nummeriert, Sortierung innen -> aussen, darin
    die Reihenfolge im JSON. Die Nummer steht im Blip und führt zur Legende.
  · Ein Trend OHNE "sector" verteilt sich gleichmaessig über den ganzen Ring.
    Reicht der Platz dort nicht, wandert er in den am wenigsten belegten
    Sektor, in der Legende steht er dann unter "–". Passt er nirgends, meldet
    die Engine das über eine sichtbare Meldung und in der Browser-Konsole.
    Die Seite bleibt immer benutzbar.
  · Die Verteilung ist deterministisch: gleiche Daten => gleiche Pixel.

  ─  ─ CSS-VARIABLEN (in einer eigenen <style>-Zeile überschreibbar)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  --tr-bg --tr-ink --tr-muted --tr-grid --tr-sector-line --tr-border
  --tr-font --tr-font-size --tr-blip-stroke --tr-blip-stroke-width
-->
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ------------------------------------------------------------------
     Dieser Block traegt ausschliesslich STRUKTUR, INTERAKTION und PRINT.
     Farben, Schriftgroessen und Abstaende stehen als Inline-Styles direkt
     an den Elementen - deshalb funktioniert die statische Variante
     (build.js) auch dann, wenn dieses <style> gar nicht vorhanden ist.
     ------------------------------------------------------------------ */

  html, body { height: 100%; }
  body { margin: 0; }

  .tr-root, .tr-root * { box-sizing: border-box; }

  .tr-stage svg { width: 100%; height: 100%; display: block; }

  .tr-btn {
    font: inherit; font-size: 0.85em; line-height: 1;
    padding: 6px 12px; cursor: pointer;
    border: 1px solid var(--tr-border, #e8e8e8);
    background: transparent; color: inherit;
    border-radius: 999px;
  }
  .tr-btn:hover { border-color: var(--tr-muted, #6b7280); }
  .tr-btn[aria-pressed="true"] {
    background: var(--tr-ink, #111111);
    border-color: var(--tr-ink, #111111);
    color: var(--tr-bg, #ffffff);
  }
  .tr-btn:focus-visible { outline: 2px solid var(--tr-ink, #111); outline-offset: 2px; }

  /* Blip-Highlight: die Regel überschreibt nur eine CSS-Variable, die im
     Inline-Style als var(--tr-blip-stroke-width, ⬦) referenziert wird.
     Deshalb braucht es hier kein !important. */
  tr.tr-row:hover { background: var(--tr-row-hover, #f6f6f6); }
  .tr-blip { cursor: default; }
  .tr-blip-link { cursor: pointer; }
  .tr-blip:hover { --tr-blip-stroke-width: 3.5px; }
  .tr-blip.is-hl  { --tr-blip-stroke-width: 3.5px; }
  a.tr-blip-link:hover text { text-decoration: underline; }

  a { color: inherit; }
  .tr-link { text-decoration: underline; text-underline-offset: 2px; }
  .tr-link:hover { text-decoration-thickness: 2px; }

  /* Druck.

     !important ist hier keine Faelle von Unsauberkeit, sondern Notwendigkeit:
     Raster, Hoehe und Farben stehen als Inline-Styles an den Elementen, und
     ein Inline-Style schlaegt jede normale Regel. Ohne !important bliebe beim
     Drucken das Bildschirmraster aktiv (height:100dvh, display:grid) und die
     Legende wuerde abgeschnitten statt auf Folie zwei gedruckt. */
  @media print {
    .tr-toolbar { display: none !important; }
    .tr-root {
      height: auto !important; min-height: 0 !important;
      display: block !important; padding: 0 !important;
      background: #fff !important;
    }
    /* Legende steht unter dem Radar. Wenn der Radar fast die ganze Seite
       einnimmt, beginnt die Legende zwangslaeufig auf Folie zwei. 62vh lassen
       genug Platz, damit die Legende noch auf Folie eins beginnen kann. */
    .tr-stage { max-height: 62vh !important; break-inside: avoid; page-break-inside: avoid; }
    .tr-legend-wrap { max-height: none !important; overflow: visible !important; display: block !important; }
    .tr-ringblock { break-inside: avoid; page-break-inside: avoid; margin-top: 12px; }
    .tr-row { break-inside: avoid; page-break-inside: avoid; }
    a.tr-link { text-decoration: none; }
  }
</style>
</head>
<body>

<!-- ──  ENGINE - nicht bearbeiten. Reihenfolge: pure Berechnung, dann Markup,
     dann DOM-Verkabelung. build.js fuehrt genau diesen Block in einer
     Node-vm aus, deshalb darf ausserhalb der Funktionen kein DOM benutzt
     werden und es darf kein eval/new Function vorkommen.
     ────────────────────────────────────────────────────────────────── -->
<script id="trendradar-engine">
const TrendRadar = (function () {
  "use strict";

  var TAU = Math.PI * 2;
  var RING_FALLBACK = ["#2e7d32", "#0e7490", "#b45309", "#b91c1c", "#6b21a8", "#334155"];

  var THEME_DEFAULT = {
    background: "#ffffff", ink: "#111111", muted: "#6b7280",
    grid: "#e6e6e6", sectorLine: "#cfcfcf", border: "#e8e8e8",
    bandOpacity: 0.10, bandOpacityAlt: 0.05,
    blipStroke: "#00000026", blipStrokeWidth: 2,
    font: "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
    fontSize: 14, headSize: 21, sectorLabelSize: 13, showSectorLabels: true,
    radius: 8
  };

  var LAYOUT_DEFAULT = {
    legend: { mode: "grouped" },
    size:   { mode: "auto", min: 380, max: 660, radius: 480, blip: 22, gap: 4 }
  };

  /* Inline-Styles. Die statische Variante (build.js) benutzt exakt dieselben
     Strings, damit beide Ausgaben pixelgleich sind. Farben laufen über
     var(--tr-*, fallback): ohne <style> greift der Fallback, mit <style>
     kann der Host die Variablen ueberschreiben. */
  var S = {
    /* Bestaetigte Hoehe statt min-height: nur dann bekommt die Zeile
       minmax(0,1fr) ueberhaupt eine Groesse, in der der Radar steckt. Mit
       min-height waere die Zeilengroesse unbestimmt, der Radar wuerde
       seine Quadratform auf die Spalte ausdehnen und die Legende
       nach unten schieben. Die Legende scrollt intern, die Seite selbst
       nicht – das ist das erwartete Verhalten im IFrame. */
    root: "margin:0;box-sizing:border-box;display:grid;gap:14px;padding:18px;height:100vh;height:100dvh;min-height:320px;" +
          "background:var(--tr-bg,#ffffff);color:var(--tr-ink,#111111);font-family:var(--tr-font,sans-serif);font-size:var(--tr-font-size,14px);" +
          "grid-template-areas:'head' 'stage' 'legend';grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)",
    head: "grid-area:head;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px",
    headTitle: "margin:0;font-size:1.5em;line-height:1.2;font-weight:700;letter-spacing:-0.01em",
    headMeta: "color:var(--tr-muted,#6b7280)",
    stage:
"grid-area:stage;display:grid;place-items:center;min-height:0;min-width:0;min-height:200px;overflow:hidden",
    /* Das SVG fuellt die Buehne exakt und wird von preserveAspectRatio
       mittig eingepasst: es kann seine Spalte nie aufdehnen. */
    svgFit: "display:block;width:100%;height:100%;min-width:0;min-height:0",
    /* Die Legende liegt fest unter dem Radar und scrollt fuer sich. Die
       Obergrenze liegt bewusst unter der Haelfte des Rahmens: der Radar ist
       das Hauptelement, die Tabelle ist Nachschlagewerk. */
    wrap: "grid-area:legend;min-height:0;max-height:38vh;max-height:38dvh;overflow:auto;display:flex;flex-direction:column;gap:10px",
    toolbar: "display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:none",
    legend: "display:flex;flex-direction:column;gap:16px",
    block: "display:block",
    ringHead: "display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 8px",
    table: "width:100%;border-collapse:collapse;table-layout:auto",
    th: "text-align:left;font-size:0.85em;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;" +
        "color:var(--tr-muted,#6b7280);padding:5px 10px 5px 0;border-bottom:1px solid var(--tr-border,#e8e8e8);white-space:nowrap",
    td: "vertical-align:top;padding:6px 10px 6px 0;border-top:1px solid var(--tr-border,#e8e8e8);line-height:1.45",
    tdNum: "vertical-align:top;padding:6px 10px 6px 0;border-top:1px solid var(--tr-border,#e8e8e8);line-height:1.45;width:1%",
    clip: "max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap",
    muted: "color:var(--tr-muted,#6b7280)",
    errBox: "margin:40px auto;max-width:64ch;padding:20px 24px;border:1px solid var(--tr-border,#e8e8e8);border-radius:10px;line-height:1.6"
  };


  /* ── kleine Helfer ─────────────────────────────────────────────── */

  function str(v, d) { return typeof v === "string" && v.trim() ? v.trim() : (d || ""); }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function isHex(c) { return typeof c === "string" && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c.trim()); }
  function color(v, d) { return isHex(v) ? v.trim() : d; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* Wählt Schwarz oder Weiß als Textfarbe auf einer Flächenfarbe. Damit die
     Nummer im Blip auch bei hellen Ringfarben lesbar bleibt. */
  function inkOn(hex) {
    var m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(String(hex).trim());
    if (!m) return "#111111";
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    function ch(i) {
      var v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    var L = 0.2126 * ch(0) + 0.7152 * ch(2) + 0.0722 * ch(4);
    return L > 0.4 ? "#111111" : "#ffffff";
  }

  function mergeDeep(base, over) {
    var out = {};
    var k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    if (!over || typeof over !== "object") return out;
    for (k in over) {
      if (!Object.prototype.hasOwnProperty.call(over, k) || over[k] === undefined) continue;
      var v = over[k], b = base[k];
      if (v && typeof v === "object" && !Array.isArray(v) && b && typeof b === "object" && !Array.isArray(b)) out[k] = mergeDeep(b, v);
      else out[k] = v;
    }
    return out;
  }

  function nOf(v, d, lo, hi) { v = num(v, d); if (v < lo) v = lo; if (v > hi) v = hi; return v; }


  /* ── 1. Daten prüfen und normalisieren ─────────────────────────── */

  function validate(data) {
    var errors = [], warnings = [];
    var out = { meta: {}, rings: [], sectors: [], entries: [], warnings: warnings, errors: errors };

    if (!data || typeof data !== "object" || Array.isArray(data)) {
      errors.push("Keine Daten gefunden. Der JSON-Block \"trendradar-data\" ist leer oder ungültig.");
      return out;
    }
    out.meta = {
      title: str(data.title, "Trendradar"),
      subtitle: str(data.subtitle, ""),
      date: str(data.date, ""),
      schemaVersion: num(data.schemaVersion, 1)
    };

    var rawRings = Array.isArray(data.rings) ? data.rings : [];
    var seenRing = {};
    rawRings.forEach(function (r, i) {

  function balancedSplit(n, L) {

  /* ── Platzierung: Spuren, Kapazität, Überlappung ────────────────────
     Überlappung ist mathematisch ausgeschlossen, weil die Kapazität einer
     Spur dort geprüft wird, wo der Bogenabstand zweier Blips am kleinsten
     ist – also genau auf dem Radius, auf dem sie liegen:

         cap_j = floor(span · rMid_j / (blip + gap))

     Alle Blips einer Spur teilen denselben Radius rMid_j, also ist
     rMid·span/count der kleinste Bogenabstand innerhalb dieser Spur. Der
     Abstand zur Spur daruber ist laneDepth, und das ist wegen
     L ≤ floor(depth/(blip+gap)) immer ≥ 1 · blip+gap.

     Die Spuren decken das Band lückenlos ab: laneDepth = depth/L, off = 0.
     Ein Versatz nach innen oder aussen ist gar nicht moeglich, sonst
     verliessen Blips ihren Ring.

     Unter den möglichen Spaltenzahlen gewinnt die, deren Blips in Pixeln am
     quadratischsten wirken (Bogenabstand ≤ Spurabstand). Bei Gleichstand gewinnt
     die kleinere Spaltenzahl, weil L aufsteigend geprüft wird. */
  function chooseLanes(n, r0, r1, span, blip, gap) {
    var depth = Math.max(1e-6, r1 - r0);

    var maxLanes = Math.max(1, Math.min(n, Math.floor(depth / step)));
    var best = null, L, j;

    function evaluate(L) {

      var counts = balancedSplit(n, L);
      var feasible = true, rMean = 0, capacity = 0;
      for (j = 0; j < L; j++) {
        var rMid = r0 + (j + 0.5) * laneDepth;
        var cap = Math.floor((span * rMid) / step);
        capacity += cap;
        if (counts[j] > cap) feasible = false;
        rMean += rMid;

      var arcGap = (span * (rMean / L)) / (n / L);
      return {
        L: L, laneDepth: laneDepth, off: 0, counts: counts, feasible: feasible,
        capacity: capacity, score: Math.abs(Math.log(arcGap / laneDepth))

    }

    for (L = 1; L <= maxLanes; L++) {
      var cand = evaluate(L);
      if (cand.feasible && (!best || cand.score < best.score - 1e-9)) best = cand;
    }
    if (best) return best;

        '<circle cx="0" cy="0" r="' + b.r.toFixed(2) + '" style="fill:' + b.ring.color +
          ';stroke:var(--tr-blip-stroke,' + t.blipStroke + ');stroke-width:var(--tr-blip-stroke-width,' + t.blipStrokeWidth + ')"/>' +
        '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" style="fill:' + inkOn(b.ring.color) +
          ';font-family:var(--tr-font,sans-serif);font-size:' + layout.size.numberFont.toFixed(2) +
          'px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none">' + b.entry.number + "</text>" +
        "<title>" + esc(label) + "</title>";

      var g = '<g class="tr-blip" data-nr="' + b.entry.number + '" transform="translate(' +
        b.x.toFixed(3) + " " + b.y.toFixed(3) + ')">' + inner + "</g>";

      if (b.entry.url) {
        var bt = linkTarget(b.entry, layout.links.target);
        out.push('<a class="tr-blip-link" href="' + esc(b.entry.url) + '"' +
          (bt ? ' target="' + bt + '" rel="noopener noreferrer"' : "") +
          ' style="cursor:pointer" aria-label="' + esc(name + " \u2013 " + b.ring.name + " \u00f6ffnen") +
          '">' + g + "</a>");
      } else {
        out.push(g);
      }
    });
    out.push("</g>");

    out.push("</svg>");
    return out.join("");
  }


  function chip(style, ring) {
    return '<span class="tr-chip" style="' + style + 'background:' + ring.color +
      ';border-radius:3px;width:12px;height:12px;flex:none;display:inline-block;transform:translateY(1px)"></span>';
  }

  /* Nummer-Badge der Legende. Die Zahl ist die des Eintrags - sie muss zum
     Blip passen - die Farbe kommt vom Ring, damit die Ringzugehörigkeit
     ablesbar bleibt. */
  function nrBadge(ring, n) {
    return '<span class="tr-nr" style="display:inline-flex;align-items:center;justify-content:center;' +
      'width:22px;height:22px;border-radius:50%;background:' + ring.color + ';color:' + inkOn(ring.color) +
      '">' + esc(n) + "</span>";
  }

  /* Ziel eines Ankers bestimmen.

     null bedeutet: gar kein target-Attribut. Das ist bei Sprungmarken
     ("#abschnitt") richtig - ein _blank darauf wuerde nur eine zweite,
     leere Kopie des Dokuments oeffnen, in der die Sprungmarke nicht
     existiert. Relative Ziele ("/berichte/q3") bekommen das target aus
     der Konfiguration, sonst wuerde die Seite im selben Tab ersetzt. */
  function linkTarget(e, def) {
    if (!e.url || e.url.charAt(0) === "#") return null;
    return e.target || def;
  }

  function nameCell(e, def) {
    if (!e.url) return esc(e.name);
    var t = linkTarget(e, def);
    return '<a class="tr-link" href="' + esc(e.url) + '"' +
      (t ? ' target="' + t + '" rel="noopener noreferrer"' : "") + ">" + esc(e.name) + "</a>";
  }

  function descCell(e) {
    if (!e.description) return '<td style="' + S.td + S.muted + '">\u2013</td>';
    return '<td style="' + S.td + S.muted + '"><div style="' + S.clip + '" title="' + esc(e.description) + '">' +
      esc(e.description) + "</div></td>";
  }

  function linkCell(e, def) {
    if (!e.url) return '<td style="' + S.td + S.muted + '">\u2013</td>';
    var t = linkTarget(e, def);
    var short = e.url.replace(/^https?:\/\//, "").replace(/#.*$/, " \u2026").replace(/\/$/, "");
    return '<td style="' + S.td + '"><a class="tr-link" href="' + esc(e.url) + '"' +
      (t ? ' target="' + t + '" rel="noopener noreferrer"' : "") + ">" + esc(short) + "</a></td>";
  }

  /* ── 5. Legende ────────────────────────────────────────────────── */

  function renderLegendHTML(layout, mode) {
    var target = layout.links.target;
    var hasSector = !!(layout.wedges[0] && layout.wedges[0].sector);
    var anyUrl = layout.blips.some(function (b) { return !!b.entry.url; });
    var blocks = [];

    if (mode === "flat") {
      var head = '<tr><th style="' + S.th + '">Nr</th><th style="' + S.th + '">Trend</th><th style="' + S.th + '">Ring</th>' +
        (hasSector ? '<th style="' + S.th + '">Sektor</th>' : "") +
        '<th style="' + S.th + '">Beschreibung</th>' + (anyUrl ? '<th style="' + S.th + '">Link</th>' : "") + "</tr>";

      var rows = layout.blips.map(function (b) {
        var e = b.entry;
        return '<tr class="tr-row" data-nr="' + e.number + '">' +
          '<td style="' + S.tdNum + '">' + nrBadge(b.ring, e.number) + "</td>" +
          '<td style="' + S.td + '">' + nameCell(e, target) + "</td>" +
          '<td style="' + S.td + ';white-space:nowrap">' + chip("", b.ring) + " " + esc(b.ring.name) + "</td>" +
          (hasSector
            ? '<td style="' + S.td + ';white-space:nowrap">' +
              (e.sector ? esc(e.sector.name) : '<span style="' + S.muted + '">\u2013</span>') + "</td>"
            : "") +
          descCell(e) + linkCell(e, target) + "</tr>";
      }).join("");

      blocks.push('<div class="tr-block" style="' + S.block + '"><table class="tr-table" style="' + S.table + '">' +
        "<thead>" + head + "</thead><tbody>" + rows + "</tbody></table></div>");
    } else {
      layout.bands.forEach(function (band) {
        var members = layout.blips.filter(function (b) { return b.ring.index === band.index; });
        if (!members.length) return;
        var hasLinks = members.some(function (b) { return !!b.entry.url; });
        var head = '<tr><th style="' + S.th + '">Nr</th><th style="' + S.th + '">Trend</th>' +
          (hasSector ? '<th style="' + S.th + '">Sektor</th>' : "") +
          '<th style="' + S.th + '">Beschreibung</th>' +
          (hasLinks ? '<th style="' + S.th + '">Link</th>' : "") + "</tr>";

        var rows = members.map(function (b) {
          var e = b.entry;
          return '<tr class="tr-row" data-nr="' + e.number + '">' +
            '<td style="' + S.tdNum + '">' + nrBadge(b.ring, e.number) + "</td>" +
            '<td style="' + S.td + '">' + nameCell(e, target) + "</td>" +
            (hasSector
              ? '<td style="' + S.td + ';white-space:nowrap">' +
                (e.sector ? esc(e.sector.name) : '<span style="' + S.muted + '">\u2013</span>') + "</td>"
              : "") +
            descCell(e) + (hasLinks ? linkCell(e, target) : "") + "</tr>";
        }).join("");

        blocks.push(
          '<section class="tr-ringblock" data-ring="' + esc(band.ring.id) + '" style="' + S.block + '">' +
            '<div class="tr-ringhead" style="' + S.ringHead + '">' + chip("", band.ring) +
            '<span class="tr-ringname" style="font-weight:700;letter-spacing:0.04em">' + esc(band.ring.name) + "</span>" +
            '<span class="tr-count" style="color:var(--tr-muted,#6b7280);font-size:0.85em">' + members.length + " Trends</span>" +
            (band.ring.description
              ? '<span class="tr-ringdesc" style="color:var(--tr-muted,#6b7280);flex:1 1 22ch;min-width:0">' + esc(band.ring.description) + "</span>"
              : "") +
            "</div>" +
            '<table class="tr-table" style="' + S.table + '"><thead>' + head + "</thead><tbody>" + rows + "</tbody></table>" +
          "</section>"
        );
      });
    }

    return '<div class="tr-legend" style="' + S.legend + '">' + blocks.join("") + "</div>";
  }


  /* ── 6. Kopfsatz ───────────────────────────────────────────────── */

  function renderHeadHTML(layout) {
    var bits = [];
    bits.push('<h1 class="tr-title" style="' + S.headTitle + '">' + esc(layout.meta.title) + "</h1>");
    var meta = [];
    if (layout.meta.date) meta.push(esc(layout.meta.date));
    meta.push(layout.blips.length + " Trends");
    meta.push(layout.bands.length + " Ringe");
    if (layout.wedges.length && layout.wedges[0].sector) meta.push(layout.wedges.length + " Sektoren");
    if (layout.meta.subtitle) {
      bits.push('<span class="tr-sub" style="' + S.headMeta + ';flex:1 1 100%">' + esc(layout.meta.subtitle) + "</span>");
    }
    return bits.join("");
  }


  /* ── 7. Fehlerausgabe ──────────────────────────────────────────── */

  function renderErrorHTML(errors, warnings) {
    var html = '<div class="tr-error" style="' + S.errBox + '">';
    html += '<h2 style="margin:0 0 8px;font-size:1.1em">Trendradar kann nicht dargestellt werden</h2><ul style="margin:0 0 12px;padding-left:20px">';
    errors.forEach(function (e) { html += "<li>" + esc(e) + "</li>"; });
    html += "</ul>";
    if (warnings && warnings.length) {
      html += '<p style="margin:0 0 6px;font-weight:600">Hinweise</p><ul style="margin:0;padding-left:20px;color:var(--tr-muted,#6b7280)">';
      warnings.forEach(function (w) { html += "<li>" + esc(w) + "</li>"; });
    }
    html += "</div>";
    return html;
  }

  /* ── 8. DOM-Verkabelung (nur im Browser) ─────────────────────────── */

  function cssVars(theme) {
    return {
      "--tr-bg": theme.background,
      "--tr-ink": theme.ink,
      "--tr-muted": theme.muted,
      "--tr-grid": theme.grid,
      "--tr-sector-line": theme.sectorLine,
      "--tr-border": theme.border,
      "--tr-font-size": theme.fontSize + "px",
      "--tr-blip-stroke": theme.blipStroke,
      "--tr-blip-stroke-width": theme.blipStrokeWidth + "px"
    };
  }

  function mount(root, rawData) {
    if (!root) return null;
    var doc = root.ownerDocument || (typeof document !== "undefined" ? document : null);
    var win = doc && doc.defaultView ? doc.defaultView : (typeof window !== "undefined" ? window : null);
    var norm = validate(rawData);
    norm.warnings.forEach(function (w) { if (typeof console !== "undefined") console.warn("[Trendradar] " + w); });

    if (norm.errors.length) {
      var box = doc.createElement("div");
      box.innerHTML = renderErrorHTML(norm.errors, norm.warnings);
      while (root.firstChild) root.removeChild(root.firstChild);
      root.appendChild(box.firstChild);
      return null;
    }

    var layout = computeLayout(norm);
    if (layout.overflow && typeof console !== "undefined") {
      console.warn("[Trendradar] " + layout.warnings[layout.warnings.length - 1]);
    }

    var head = root.querySelector(".tr-head");
    var stage = root.querySelector(".tr-stage");
    var legendWrap = root.querySelector(".tr-legend-wrap");
    var toolbar = root.querySelector(".tr-toolbar");
    var legendBox = root.querySelector(".tr-legend");

    /* Struktur hier und in build.js aus denselben Strings setzen. Steht hier
       kein Style, wandern die drei Bereiche ins automatische Raster, der
       Radar verliert seinen Platz und die Legende landet darunter. */
    if (head) head.style.cssText = S.head;
    if (stage) stage.style.cssText = S.stage;
    if (toolbar) toolbar.style.cssText = S.toolbar;
    if (legendBox) legendBox.style.cssText = S.legend;

    head.innerHTML = renderHeadHTML(layout);
    stage.innerHTML = renderSVG(layout);

    var mode = norm.layout.legend.mode;

    function paintLegend() {
      legendBox.innerHTML = renderLegendHTML(layout, mode);
      if (toolbar) {
        Array.prototype.forEach.call(toolbar.querySelectorAll(".tr-btn"), function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === mode ? "true" : "false");
        });
      }
      wireHighlight();
    }

    /* Tabelle ↔ Radar: Zeile oder Nummer markiert den Blip. */
    function wireHighlight() {
      var map = {};
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip"), function (g) {
        map[g.getAttribute("data-nr")] = g;
      });
      Array.prototype.forEach.call(legendBox.querySelectorAll(".tr-row"), function (row) {
        function on() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.add("is-hl"); }
        function off() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.remove("is-hl"); }
        row.addEventListener("mouseenter", on);
        row.addEventListener("mouseleave", off);
      });
    }

    paintLegend();

    /* Umschalter gruppiert / flach */
    if (toolbar) {
      toolbar.style.cssText = S.toolbar;
      toolbar.innerHTML = '<span style="' + S.muted + ';font-size:0.85em;margin-right:auto">Legende</span>' +
        '<button type="button" class="tr-btn" data-mode="grouped">Gruppiert</button>' +
        '<button type="button" class="tr-btn" data-mode="flat">Flach</button>';
      toolbar.addEventListener("click", function (ev) {
        var btn = ev.target.closest ? ev.target.closest(".tr-btn") : null;
        if (!btn) return;
        mode = btn.getAttribute("data-mode") === "flat" ? "flat" : "grouped";
        paintLegend();
      });
    }

    /* Seitenraster: Kopf, Radar, Legende untereinander. Fest, ohne Messung
       und ohne Zustaendigkeit – die Legende liegt immer unter dem Radar,
       unabhaengig von der Rahmenbreite. */
    root.style.cssText = S.root + "border-radius:" + norm.theme.radius + "px";
    if (legendWrap) legendWrap.style.cssText = S.wrap;

    /* Theme als CSS-Variablen bereitstellen – so lässt sich das Design auch
       von aussen überschreiben, ohne die Datei anzufassen. */
    var vars = cssVars(norm.theme);
    Object.keys(vars).forEach(function (k) { root.style.setProperty(k, vars[k]); });

    return layout;
  }

  function readEmbeddedData(doc) {
    var el = doc.getElementById("trendradar-data");
    if (!el) return null;
    try {
      return JSON.parse(el.textContent || el.innerText || "{}");
    } catch (err) {
      if (typeof console !== "undefined") console.error("[Trendradar] JSON-Block ist ungültig: " + err.message);
      return { __parseError: err.message };
    }
  }

  function autoInit(doc) {
    doc = doc || (typeof document !== "undefined" ? document : null);
    if (!doc) return null;
    var root = doc.querySelector(".tr-root");
    if (!root) return null;
    var data = readEmbeddedData(doc);
    if (data && data.__parseError) {
      root.innerHTML = renderErrorHTML(["Der JSON-Block \"trendradar-data\" ist nicht gültiges JSON: " + data.__parseError], []);
      return null;
    }
    return mount(root, data);
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { autoInit(); });
    else autoInit();
  }

  return {
    TAU: TAU,
    STYLE: S,
    validate: validate,
    computeLayout: computeLayout,
    renderSVG: renderSVG,
    renderLegendHTML: renderLegendHTML,
    renderHeadHTML: renderHeadHTML,
    renderErrorHTML: renderErrorHTML,
    cssVars: cssVars,
    mount: mount,
    autoInit: autoInit,
    readEmbeddedData: readEmbeddedData
  };
})();

if (typeof globalThis !== "undefined") globalThis.TrendRadar = TrendRadar;
if (typeof module !== "undefined" && module.exports) module.exports = TrendRadar;
</script>
</body>
</html>
