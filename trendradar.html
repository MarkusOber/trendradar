<!doctype html>
<!--
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  TRENDRADAR
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─

  1. Kopieren. Fertig. Die Datei laeuft per Doppelklick, per <iframe src> und
     auf jedem statischen Hosting. Kein Server, kein Build, keine Abhaengigkeit.

  2. Alles Anpassbare steht im JSON-Block weiter unten ("trendradar-data").
     Nur diesen Block aendern - der Rest der Datei bleibt unangetastet.

  3. Fuer eine Umgebung ohne JavaScript (z. B. iFrame mit sandbox ohne
     allow-scripts, oder ein CMS, das <script> entfernt):

        node build.js trendradar.html -o radar.html

     Das Ergebnis ist eine statische Datei ohne einen einzigen <script> und
     ohne <style>. Beide Wege nutzen exakt dieselbe Layout-Engine.

  4. Die Datei fuellt ihren Rahmen aus: sie ist so hoch wie das Sichtfenster,
     der Radar nimmt den quadratischen Platz darin ein, die Legende steht
     darunter und scrollt intern. Die Seite selbst scrollt nicht. Im <iframe>
     also eine Hoehe mitgeben, sonst stuetzt sich der Inhalt auf die Hoehe
     des iframes:

        <iframe src="radar.html" style="width:100%;height:720px;border:0"></iframe>

  ─  ─ SCHEMA (nur Pflichtfelder sind markiert, alles andere ist optional)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
    "schemaVersion": 1,          // nur hochzaehlen bei NEUEN (additiven) Feldern
    "subtitle":    "Optionaler Untertitel.",
    "date":        "2026-09-29",

    "links":  { "target": "_blank" },     // "_blank" | "_self"  = Vorgabe

    "layout": {
      "legend": { "mode": "grouped" },   // "grouped" | "flat"  (umschaltbar)
                                         // Die Legende liegt immer unter dem
                                         // Radar und scrollt fuer sich.
      "size":   { "mode": "auto",         // "auto" = waechst bis alles passt
                  "min": 380,             // "fixed" = Radius fest
                  "max": 660,             // Obergrenze für "auto"
                  "radius": 480,          // Radius für "fixed"
                  "blip": 22,             // Blip-Durchmesser in SVG-Einheiten
                  "gap": 4 }              // Mindestabstand zwischen Blips
    },

    "theme": {                 // jede Farbe auch als CSS-Variable überschreibbar
      // Die Vorgabefarben sind dem Designsystem der Bundesagentur für Arbeit
      // (DPL 3.11.1) entnommen: Navy #020E25 auf #F9FBFC, Rot #B30920 nur
      // für Aktionen, harte Linien in den Graustufen der Palette.
      "background": "#F9FBFC", "ink": "#020E25", "muted": "#495057",
      "grid": "#DEE2E6", "sectorLine": "#ADB5BD", "border": "#595959",
      "accent": "#B30920",     // Aktionen, Fokusring, aktiver Schalter
      // Schriftstapel ohne Webfont: Roboto/Roboto Condensed sind auf vielen
      // Systemen vorhanden, sonst greift Helvetica/Arial. Bewusst kein @font-face
      // und kein <link> – die Datei muss auch offline und im iFrame stimmen.
      "font": "Roboto, Helvetica Neue, Arial, sans-serif",
      "headFont": "Roboto Condensed, Roboto, Arial Narrow, Arial, sans-serif",
      "fontSize": 15, "headSize": 24,
      "sectorLabelSize": 13, "showSectorLabels": true
    },

    "rings":   [               // 3-6 Ringe, REIHENFOLGE = Zentrum -> Rand
      { "id": "adopt", "name": "ADOPT", "color": "#1F8904",
        "description": "Wird breit genutzt, wir investieren langfristig." }
    ],

    "sectors": [               // optional. [] = nur Ringe, ohne Tortenstuecke
      { "id": "tech", "name": "Technologie" }
    ],

    "entries": [               // 10-40 Trends
      { "name": "Pflicht",                    // Pflicht
        "ring": "adopt",                     // Pflicht: muss eine ring-id sein
        "sector": "tech",                    // optional: muss eine sector-id sein
        "description": "Optional",           // optional
        "target": "_self",                   // optional: "_blank" | "_self"
        "url": "https://example.com/trend"   // optional
      }
    ]
  }
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─

  ─  ─ REGELN, DIE DIE ENGINE GARANTIERT (man muss sich nicht darum kümmern)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  · Trends werden global 1..N nummeriert, Sortierung innen -> aussen, darin
    die Reihenfolge im JSON. Die Nummer steht im Blip und führt zur Legende.
  · Ein Trend OHNE "sector" verteilt sich gleichmaessig über den ganzen Ring.
    Reicht der Platz dort nicht, wandert er in den am wenigsten belegten
    Sektor, in der Legende steht er dann unter "–". Passt er nirgends, meldet
    die Engine das über eine sichtbare Meldung und in der Browser-Konsole.
    Die Seite bleibt immer benutzbar.
  · Die Verteilung ist deterministisch: gleiche Daten => gleiche Pixel.

  ─  ─ CSS-VARIABLEN (in einer eigenen <style>-Zeile überschreibbar)
  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─
  --tr-bg --tr-ink --tr-muted --tr-grid --tr-sector-line --tr-border
  --tr-accent --tr-row-hover --tr-font --tr-head-font --tr-font-size
  --tr-blip-stroke --tr-blip-stroke-width
-->
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ------------------------------------------------------------------
     Dieser Block traegt ausschliesslich STRUKTUR, INTERAKTION und PRINT.
     Farben, Schriftgroessen und Abstaende stehen als Inline-Styles direkt
     an den Elementen - deshalb funktioniert die statische Variante
     (build.js) auch dann, wenn dieses <style> gar nicht vorhanden ist.
     ------------------------------------------------------------------ */

  html, body { height: 100%; }
  body { margin: 0; }

  .tr-root, .tr-root * { box-sizing: border-box; }

  .tr-stage svg { width: 100%; height: 100%; display: block; }

  .tr-btn {
    font: inherit; font-size: 0.9em; line-height: 1.4;
    padding: 6px 16px; cursor: pointer;
    /* Feiner Rahmen aus dem Rasterton: --tr-border traegt die kräftige
       Tabellenlinie der Arbeitsagentur und waere fuer einen Umriss zu
       schwer. */
    border: 1px solid var(--tr-grid, #DEE2E6);
    background: transparent; color: inherit;
    /* Harte, kleine Radien statt Pillen – so baut das Designsystem der
       Arbeitsagentur seine Schalter (.ba-btn: border-radius 5px,
       padding .375rem 1rem). */
    border-radius: 5px;
    transition: box-shadow .08s;
  }
  .tr-btn:hover { border-color: var(--tr-ink, #020E25); }
  /* Aktiv = Primäraktion in Rot, inaktiv = ruhiger Umriss. So bleibt der
     Zustand auch ohne Farbe am Rahmen und an der Schrift erkennbar. */
  .tr-btn[aria-pressed="true"] {
    background: var(--tr-accent, #B30920);
    border-color: var(--tr-accent, #B30920);
    color: var(--tr-bg, #F9FBFC);
  }
  .tr-btn:focus-visible { outline: 3px solid var(--tr-accent, #B30920); outline-offset: 2px; }

  /* Blip-Highlight: die Regel überschreibt nur eine CSS-Variable, die im
     Inline-Style als var(--tr-blip-stroke-width, ⬦) referenziert wird.
     Deshalb braucht es hier kein !important. */
  tr.tr-row:hover { background: var(--tr-row-hover, rgba(2,14,37,.05)); }
  tr.tr-row { position: relative; }
  tr.tr-row.is-link { cursor: pointer; }
  /* Die ganze Zeile ist das Klickziel, aber der echte <a> bleibt im
     Trendnamen: nur seine ::after-Flaeche wird ueber die Zeile gespannt.
     So bleiben Tastaturbedienung, "Link in neuem Tab oeffnen" und
     Screenreader-Semantik erhalten, statt die Zeile umzubauen.
     Bewusst im <style>-Block und damit nur in der interaktiven Variante:
     eine Pseudo-Element-Regel laesst sich nicht inline setzen, und die
     statische Ausgabe kommt ohne <style> aus. Dort bleibt der Link auf
     den Trendnamen beschraenkt - so wie dort auch kein Hover und keine
     Tastaturhervorhebung stattfindet. */
  tr.tr-row.is-link a.tr-link::after { content: ""; position: absolute; inset: 0; }
  tr.tr-row.is-link:focus-within {
    background: var(--tr-row-hover, rgba(2,14,37,.05));
    outline: 3px solid var(--tr-accent, #B30920);
    outline-offset: -2px;
  }
  tr.tr-row.is-link a.tr-link:focus-visible { outline: none; }
  .tr-blip { cursor: default; }
  .tr-blip-link { cursor: pointer; }
  .tr-blip:hover { --tr-blip-stroke-width: 3.5px; }
  .tr-blip.is-hl  { --tr-blip-stroke-width: 3.5px; }
  a.tr-blip-link:hover text { text-decoration: underline; }

  a { color: inherit; }
  .tr-link { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .tr-link:hover { text-decoration-thickness: 2px; color: var(--tr-accent, #B30920); }


  /* Schmale Rahmen: die Beschreibungsspalte darf nicht auf einen nutzlosen
     Rest zusammenschrumpfen, weil sie als einzige keinen festen Anteil
     bekommt. Also bekommen die Spalten mit kurzen Beschriftungen eine
     Mindestbreite in Pixeln; den Rest nimmt die Beschreibung.
     !important schlaegt hier die Inline-Breite am <col>, die fuer die
     statische Variante ohne <style> noetig bleibt. */
  @media (max-width: 575.98px) {
    .tr-col-name   { width: 21% !important; }
    .tr-col-sector { width: 96px !important; }
    .tr-col-desc   { width: auto !important; }
  }

  /* Gestapelte Tabelle auf schmalen Rahmen - genau der Weg, den die
     Arbeitsagentur bei table.ba-table geht: die Kopfzeile wandert aus dem
     Sichtfeld, jede Zelle wird ein Paar aus Bezeichnung und Wert, und die
     Bezeichnung kommt aus dem data-label der Zelle.
     Bewusst nur im <style>-Block: ein ::before mit content:attr() laesst
     sich nicht inline setzen. Die statische Ausgabe bleibt deshalb eine
     normale Tabelle mit Kopfzeile - dort ist sie nicht gestapelt. */
  @media (max-width: 575.98px) {
    .tr-table > thead {
      position: absolute; top: auto; left: -10000px;
      width: 1px; height: 1px; overflow: hidden;
    }
    .tr-table > tbody > tr > td {
      display: flex; justify-content: flex-end;
      padding: 12px 12px 0; border: 0;
    }
    .tr-table > tbody > tr > td::before {
      content: attr(data-label);
      display: block; margin-right: auto; padding-right: 1.5rem;
      font-family: var(--tr-font, Roboto, Helvetica Neue, Arial, sans-serif);
      font-weight: 700; text-align: left;
    }
    /* Die Arbeitsagentur setzt hier keine Linien. Eine Haarlinie unter dem
       letzten Wertpaar haelt den Block trotzdem zusammen, wenn eine
       Beschreibung laenger ist als der Rest der Zeile. */
    .tr-table > tbody > tr > td:last-child { border-bottom: 1px solid var(--tr-border, #595959); }
  }

  /* Druck.

     !important ist hier keine Faelle von Unsauberkeit, sondern Notwendigkeit:
     Raster, Hoehe und Farben stehen als Inline-Styles an den Elementen, und
     ein Inline-Style schlaegt jede normale Regel. Ohne !important bliebe beim
     Drucken das Bildschirmraster aktiv (height:100dvh, display:grid) und die
     Legende wuerde abgeschnitten statt auf Folie zwei gedruckt. */
  @media print {
    .tr-toolbar { display: none !important; }
    .tr-root {
      height: auto !important; min-height: 0 !important;
      display: block !important; padding: 0 !important;
      background: #fff !important;
    }
    /* Legende steht unter dem Radar. Wenn der Radar fast die ganze Seite
       einnimmt, beginnt die Legende zwangslaeufig auf Folie zwei. 62vh lassen
       genug Platz, damit die Legende noch auf Folie eins beginnen kann. */
    .tr-stage { max-height: 62vh !important; break-inside: avoid; page-break-inside: avoid; }
    .tr-legend-wrap { max-height: none !important; overflow: visible !important; display: block !important; }
    /* Der Abstand zwischen den Ringbloecken kommt schon aus dem Raster der
       Legende (gap). Ein zusaetzlicher Aussenabstand wuerde ihn beim Druck
       nur verdoppeln. */
    .tr-ringblock { break-inside: avoid; page-break-inside: avoid; }
    .tr-row { break-inside: avoid; page-break-inside: avoid; }
    a.tr-link { text-decoration: none; }
    /* Auf Papier braucht eine Zelle nicht die 12px des Bildschirms: 14 Zeilen
       mal 24px gespart sind gut eine halbe Seite. Ohne das !important bliebe
       der Bildschirmabstand stehen, weil er am <td> inline steht. */
    .tr-table th, .tr-table td { padding: 4px 8px 4px 0 !important; }
  }
</style>
</head>
<body>

<!-- ──  ENGINE - nicht bearbeiten. Reihenfolge: pure Berechnung, dann Markup,
     dann DOM-Verkabelung. build.js fuehrt genau diesen Block in einer
     Node-vm aus, deshalb darf ausserhalb der Funktionen kein DOM benutzt
     werden und es darf kein eval/new Function vorkommen.
     ────────────────────────────────────────────────────────────────── -->
<script id="trendradar-engine">
const TrendRadar = (function () {
  "use strict";

  var TAU = Math.PI * 2;

  /* Die Vorgabefarben stammen aus dem Designsystem der Bundesagentur für
     Arbeit (DPL 3.11.1) und sind dort als Hex belegt: #020E25 Grundtext,
     #F9FBFC Flaeche, #B30920 Aktion, #495057 Sekundaertext, #DEE2E6 und
     #E4E5E7 feine Linien, #ADB5BD Sektorlinien, #595959 Tabellenlinien
     (die Tabellenflaeche der Arbeitsagentur). */
  var RING_FALLBACK = ["#1F8904", "#0B70EB", "#FF8500", "#E50000", "#0dcaf0", "#3D4657"];

  var THEME_DEFAULT = {
    background: "#F9FBFC", ink: "#020E25", muted: "#495057",
    grid: "#DEE2E6", sectorLine: "#ADB5BD", border: "#595959",
    accent: "#B30920", rowHover: "rgba(2,14,37,.05)",
    bandOpacity: 0.12, bandOpacityAlt: 0.06,
    blipStroke: "#00000026", blipStrokeWidth: 2,
    font: "Roboto, Helvetica Neue, Arial, sans-serif",
    headFont: "Roboto Condensed, Roboto, Arial Narrow, Arial, sans-serif",
    fontSize: 15, headSize: 24, sectorLabelSize: 13, showSectorLabels: true,
    radius: 5
  };

  var LAYOUT_DEFAULT = {
    legend: { mode: "grouped" },
    size:   { mode: "auto", min: 380, max: 660, radius: 480, blip: 22, gap: 4 }
  };

  /* Inline-Styles. Die statische Variante (build.js) benutzt exakt dieselben
     Strings, damit beide Ausgaben pixelgleich sind. Farben laufen über
     var(--tr-*, fallback): ohne <style> greift der Fallback, mit <style>
     kann der Host die Variablen ueberschreiben. */
  var S = {
    /* Bestaetigte Hoehe statt min-height: nur dann bekommt die Zeile
       minmax(0,1fr) ueberhaupt eine Groesse, in der der Radar steckt. Mit
       min-height waere die Zeilengroesse unbestimmt, der Radar wuerde
       seine Quadratform auf die Spalte ausdehnen und die Legende
       nach unten schieben. Die Legende scrollt intern, die Seite selbst
       nicht – das ist das erwartete Verhalten im IFrame. */
    root: "margin:0;box-sizing:border-box;display:grid;gap:14px;padding:16px;height:100vh;height:100dvh;min-height:320px;" +

    while (guard++ < 40) {
      geo = placeAll(norm, groups, R, blip, gap);
      if (geo.ok) break;
      if (size.mode === "fixed") { overflow = true; break; }
      var next = Math.min(R * 1.12, size.max);
      if (next <= R + 0.5) {
        R = size.max;
        geo = placeAll(norm, groups, R, blip, gap);
        overflow = !geo.ok;
        break;
      }
      R = next;
    }
    if (overflow) {
      /* Wie viel Platz wäre wirklich nötig? Das ist die Information, die man
         zum Handeln braucht – ein geratener Wert hilft niemandem. Wir suchen
         weiter, rendern aber weiterhin bei size.max. */
      var needR = null;
      if (size.mode !== "fixed") {
        for (var probe = size.max * 1.02, steps = 0; probe < 4000 && steps < 220; probe *= 1.02, steps++) {
          if (placeAll(norm, groups, probe, blip, gap).ok) { needR = probe; break; }
        }
      }
      var where = geo.worst
        ? "Ring \"" + geo.worst.g.ring.name + "\"" + (geo.worst.g.sector ? " / Sektor \"" + geo.worst.g.sector.name + "\"" : "") +
          " braucht allein " + geo.worst.n + " Plätze, es passen " + geo.worst.capacity + "."
        : "";
      var need = needR
        ? "Ab Radius " + Math.ceil(needR) + " wäre alles überlappungsfrei – setze \"layout.size.max\" entsprechend."
        : "Auch bei einem sehr großen Radius reicht der Platz nicht.";
      /* Ein sehr großer Radius macht die Blips im Browser entsprechend klein –
         darauf hinzuweisen ist ehrlicher als nur die Zahl zu nennen. */
      if (needR && needR > size.max * 2.2) {
        need += " Achtung: Bei so großem Radius sind die Blips nur noch " +
          Math.round(blip * 500 / needR) + " px breit (in einem 500 px hohen Rahmen). " +
          "Besser ist es, \"layout.size.blip\" zu verkleinern, einen weiteren Ring anzulegen " +
          "oder auf Sektoren zu verzichten.";
      }
      warnings.push(
        "Überfüllt: Bei Radius " + Math.round(size.max) + " passen nicht alle Blips ohne Überlappung " +
        "(geringster Abstand " + geo.minDist.toFixed(1) + " statt " + blip + "). " + where + " " + need
      );
    }

    /* viewBox: Inhalt plus Platz für Sektorbeschriftungen am Rand. */
    var t = norm.theme;
    var labelSize = nOf(t.sectorLabelSize, 13, 8, 40);
    var labelR = R + Math.max(10, labelSize * 0.9);
    var labels = [];
    if (t.showSectorLabels && geo.nS >= 3) {
      geo.wedges.forEach(function (w) {
        if (!w.sector) return;
        var chord = 2 * labelR * Math.sin(Math.min(geo.delta, Math.PI) / 2);
        var maxChars = Math.floor(chord / (labelSize * 0.55));
        if (maxChars < 3) return;
        var name = w.sector.name;
        var shown = name.length > maxChars ? name.slice(0, Math.max(1, maxChars - 1)) + "\u2026" : name;
        var mid = (w.a0 + w.a1) / 2;
        var x = labelR * Math.sin(mid), y = -labelR * Math.cos(mid);
        labels.push({ name: name, text: shown, x: x, y: y, truncated: name.length > maxChars });
      });
    }
    if (labels.length && labels[0].truncated) {
      warnings.push("Sektor-Namen am Rand sind gekürzt. Die vollständigen Namen stehen in der Legende.");
    }

    var half = R + 10;
    labels.forEach(function (l) {
      half = Math.max(half, Math.abs(l.x) + l.text.length * labelSize * 0.3, Math.abs(l.y) + labelSize * 0.7);
    });
    var W = 2 * half;
    /* Auf zwei Nachkommastellen runden: der viewBox landet sonst mit 14
       Stellen in der Ausgabe und die Datei wird unnötig unlesbar. */
    var vb = function (v) { return Math.round(v * 100) / 100; };

    /* Blips nach Nummer sortieren, damit die Ausgabe unabhängig von der
       Gruppierungsreihenfolge deterministisch ist. */
    geo.blips.sort(function (a, b) { return a.entry.number - b.entry.number; });

    return {
      meta: norm.meta,
      theme: norm.theme,
      layout: norm.layout,
      links: norm.links,
      size: { blip: blip, gap: gap, radius: R, mode: size.mode, numberFont: blip * 0.52 },
      radius: R,
      pitch: geo.pitch,
      delta: geo.delta,
      bands: geo.bands,
      wedges: geo.wedges,
      sectorLabels: labels,
      blips: geo.blips,
      viewBox: [vb(-half), vb(-half), vb(W), vb(W)].join(" "),
      overflow: overflow,
      warnings: warnings,
      groups: groups
    };
  }


  function pt(r, a) { return (r * Math.sin(a)).toFixed(3) + " " + (-r * Math.cos(a)).toFixed(3); }
  function px(r, a) { return (r * Math.sin(a)).toFixed(3); }
  function py(r, a) { return (-r * Math.cos(a)).toFixed(3); }

  function wedgePath(r0, r1, a0, a1) {
    if (a1 - a0 >= TAU - 1e-9) {
      /* voller Ring: zwei Teilkreise mit evenodd */
      return "M " + (r1).toFixed(3) + " 0 A " + r1.toFixed(3) + " " + r1.toFixed(3) + " 0 1 1 " + (-r1).toFixed(3) + " 0 A " +
        r1.toFixed(3) + " " + r1.toFixed(3) + " 0 1 1 " + r1.toFixed(3) + " 0 Z " +
        "M " + (r0).toFixed(3) + " 0 A " + r0.toFixed(3) + " " + r0.toFixed(3) + " 0 1 0 " + (-r0).toFixed(3) + " 0 A " +
        r0.toFixed(3) + " " + r0.toFixed(3) + " 0 1 0 " + r0.toFixed(3) + " 0 Z";
    }
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    return "M " + pt(r0, a0) +
      " A " + r0.toFixed(3) + " " + r0.toFixed(3) + " 0 " + large + " 1 " + pt(r0, a1) +
      " L " + pt(r1, a1) +
      " A " + r1.toFixed(3) + " " + r1.toFixed(3) + " 0 " + large + " 0 " + pt(r1, a0) + " Z";
  }

  function describe(layout) {
    var names = layout.bands.map(function (b) { return b.ring.name; });
    return layout.meta.title + ": " + layout.blips.length + " Trends in " + names.length +
      " Ringen (" + names.join(", ") + ")" +
      (layout.wedges[0] && layout.wedges[0].sector ? " und " + layout.wedges.length + " Sektoren" : "") + ". " +
      "Die Nummerierung folgt der Legende unter dem Radar.";
  }

  /* ── 4. SVG ────────────────────────────────────────────────────── */

  function renderSVG(layout) {
    var t = layout.theme;
    var out = [];
    /* Das SVG füllt die Bühne exakt aus und wird von preserveAspectRatio
       mittig eingepasst. Ohne die absolute Positionierung wächst ein
       quadratisches SVG aus seiner Rasterspalte heraus – es würde dann die
       Zeilenhöhe aufmachen und die Legende nach unten schieben. */
    out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + layout.viewBox + '"' +
      ' preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(describe(layout)) + '"' +
      ' style="' + S.svgFit + '">');
    out.push("<title>" + esc(layout.meta.title) + "</title>");
    out.push("<desc>" + esc(describe(layout)) + "</desc>");

    /* Flächen: Schachbrett aus Ring und Sektor, damit sich Blips zählen lassen. */
    out.push("<g>");
    layout.bands.forEach(function (band) {
      layout.wedges.forEach(function (w) {
        var even = (band.index + w.index) % 2 === 0;
        out.push('<path d="' + wedgePath(band.r0, band.r1, w.a0, w.a1) + '" fill="' + band.ring.color +
          '" fill-opacity="' + (even ? t.bandOpacity : t.bandOpacityAlt) + '" fill-rule="evenodd"/>');
      });
    });
    out.push("</g>");

    /* Ringgrenzen */
    out.push("<g>");
    layout.bands.forEach(function (band) {
      if (band.boundary > 0.5) {
        out.push('<circle cx="0" cy="0" r="' + band.boundary.toFixed(3) + '" fill="none" stroke="' + t.grid +
          '" stroke-width="1"/>');
      }
    });
    /* Sektorgrenzen – nur wenn Sektoren auch Daten tragen */
    if (layout.wedges[0] && layout.wedges[0].sector) {
      var pad = layout.size.blip / 2 + layout.size.gap / 2;
      layout.wedges.forEach(function (w) {
        out.push('<line x1="' + px(pad, w.a0) + '" y1="' + py(pad, w.a0) + '"' +
          ' x2="' + px(layout.radius, w.a0) + '" y2="' + py(layout.radius, w.a0) + '"' +
          ' stroke="' + t.sectorLine + '" stroke-width="1"/>');
      });
    }
    out.push("</g>");

    /* Sektorbeschriftung am Rand */
    if (layout.sectorLabels.length) {
      out.push("<g>");
      layout.sectorLabels.forEach(function (l) {
        out.push('<text x="' + l.x.toFixed(2) + '" y="' + l.y.toFixed(2) + '" text-anchor="middle"' +
          ' dominant-baseline="central" style="fill:' + t.muted + ';font-family:' + fontVar(t, true) + ';' +
          'font-size:' + nOf(t.sectorLabelSize, 13, 8, 40) + 'px;font-weight:700">' + esc(l.text) + "</text>");
      });
      out.push("</g>");
    }

    /* Blips */
    out.push('<g class="tr-blips">');
    layout.blips.forEach(function (b) {
      var name = b.entry.name;
      var label = name + " \u00b7 " + b.ring.name + " \u00b7 " + b.ring.description;
      var inner =
        '<circle cx="0" cy="0" r="' + b.r.toFixed(2) + '" style="fill:' + b.ring.color +
          ';stroke:var(--tr-blip-stroke,' + t.blipStroke + ');stroke-width:var(--tr-blip-stroke-width,' + t.blipStrokeWidth + ')"/>' +
        '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" style="fill:' + inkOn(b.ring.color) +
          ';font-family:' + fontVar(t, false) + ';font-size:' + layout.size.numberFont.toFixed(2) +
          'px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none">' + b.entry.number + "</text>" +
        "<title>" + esc(label) + "</title>";

      var g = '<g class="tr-blip" data-nr="' + b.entry.number + '" transform="translate(' +
        b.x.toFixed(3) + " " + b.y.toFixed(3) + ')">' + inner + "</g>";

      if (b.entry.url) {
        var bt = linkTarget(b.entry, layout.links.target);
        out.push('<a class="tr-blip-link" href="' + esc(b.entry.url) + '"' +
          (bt ? ' target="' + bt + '" rel="noopener noreferrer"' : "") +
          ' style="cursor:pointer" aria-label="' + esc(name + " \u2013 " + b.ring.name + " \u00f6ffnen") +
          '">' + g + "</a>");
      } else {
        out.push(g);
      }
    });
    out.push("</g>");

    out.push("</svg>");
    return out.join("");
  }


  function chip(style, ring) {
    return '<span class="tr-chip" style="' + style + 'background:' + ring.color +
      ';border-radius:3px;width:12px;height:12px;flex:none;display:inline-block;transform:translateY(1px)"></span>';
  }

  /* Nummer-Badge der Legende. Die Zahl ist die des Eintrags - sie muss zum
     Blip passen - die Farbe kommt vom Ring, damit die Ringzugehörigkeit
     ablesbar bleibt. */
  function nrBadge(ring, n) {
    return '<span class="tr-nr" style="display:inline-flex;align-items:center;justify-content:center;' +
      'width:22px;height:22px;border-radius:50%;background:' + ring.color + ';color:' + inkOn(ring.color) +
      '">' + esc(n) + "</span>";
  }

  /* Ziel eines Ankers bestimmen.

     null bedeutet: gar kein target-Attribut. Das ist bei Sprungmarken
     ("#abschnitt") richtig - ein _blank darauf wuerde nur eine zweite,
     leere Kopie des Dokuments oeffnen, in der die Sprungmarke nicht
     existiert. Relative Ziele ("/berichte/q3") bekommen das target aus
     der Konfiguration, sonst wuerde die Seite im selben Tab ersetzt. */
  function linkTarget(e, def) {
    if (!e.url || e.url.charAt(0) === "#") return null;
    return e.target || def;
  }

  /* Ein Tooltip fuer die ganze Zeile. Die gespannte ::after-Flaeche des
     Ankers liegt ueber allen Zellen und verdeckt deren Tooltips, also
     sammelt die Zeile hier, was vorher an zwei Stellen stand: die
     vollstaendige Beschreibung und das Ziel. */
  function rowTitle(e) {
    var parts = [];
    if (e.description) parts.push(e.description);
    if (e.url) parts.push(e.url);
    return parts.join("\n");
  }

  function nameCell(e, def) {
    if (!e.url) return esc(e.name);
    var t = linkTarget(e, def);
    return '<a class="tr-link" href="' + esc(e.url) + '" title="' + esc(rowTitle(e)) + '"' +
      (t ? ' target="' + t + '" rel="noopener noreferrer"' : "") + ">" + esc(e.name) + "</a>";
  }

  /* Die Arbeitsagentur setzt in table.ba-table jede Zelle auf #020E25 -
     auch die Beschreibung. Der graue Ton, den es da fuer Kleintext gibt
     (.ba-microcopy, small), gilt fuer Beschreibungen nicht. */
  function descCell(e) {
    if (!e.description) return '<td data-label="Beschreibung" style="' + S.td + '">–</td>';
    return '<td data-label="Beschreibung" style="' + S.td + '"><div style="' + S.clamp + '">' +
      esc(e.description) + "</div></td>";
  }

  /* ── 5. Legende ────────────────────────────────────────────────── */

  /* Spalten und ihre Breiten stehen genau einmal hier. Kopfzeile und
     <colgroup> werden beide aus dieser Liste gebaut, damit sie nicht
     auseinanderlaufen koennen. "desc" bezieht den Rest.
     Eine eigene Linkspalte gibt es nicht mehr: die ganze Zeile ist der
     Anker, das Ziel steht im Tooltip. Damit gehoert der Platz der
     Beschreibung.
     Die festen Breiten beruecksichtigen den Innenabstand von 12px je Seite:
     die Nummerenspalte braucht 24px davon plus das 22px-Badge. */
  var COLS = {
    num:    { w: "48px", head: "Nr" },
    name:   { w: "28%",  head: "Trend" },
    ring:   { w: "92px", head: "Ring" },
    sector: { w: "17%",  head: "Sektor" },
    desc:   { w: "auto", head: "Beschreibung" }
  };

  function colgroup(keys) {
    return "<colgroup>" + keys.map(function (k) {
      /* Die Klasse erlaubt dem Style-Block, die Breite auf schmalen
         Rahmen ueber !important zu ueberschreiben; die Inline-Breite
         bleibt der Normalfall und funktioniert auch ohne <style>. */
      return '<col class="tr-col-' + k + '" style="width:' + COLS[k].w + '">';
    }).join("") + "</colgroup>";
  }

  function headRow(keys) {
    return "<tr>" + keys.map(function (k) {
      return '<th style="' + S.th + '">' + COLS[k].head + "</th>";
    }).join("") + "</tr>";
  }

  /* Die Spalten gelten fuer alle Tabellen der jeweiligen Ansicht, damit
     jede Ringgruppe gleich breit aufgebaut ist. */
  function legendColumns(hasSector, withRing) {
    return ["num", "name"]
      .concat(withRing ? ["ring"] : [])
      .concat(hasSector ? ["sector"] : [])
      .concat(["desc"]);
  }

  /* Eine Tabellenzeile. Zeilen ohne Ziel bleiben stumm: kein Pointer, kein
     Anker, kein Tooltip.
     data-label steht an jeder Zelle: unter 576px verbirgt der Style-Block
     die Kopfzeile und holt sich daraus die Spaltenbezeichnung - so
     bleibt die Tabelle auch gestapelt ohne zweite Kopfzeile lesbar. */
  function legendRow(b, hasSector, withRing, target) {
    var e = b.entry;
    return '<tr class="tr-row' + (e.url ? " is-link" : "") + '" data-nr="' + e.number + '">' +
      '<td data-label="Nr" style="' + S.tdNum + '">' + nrBadge(b.ring, e.number) + "</td>" +
      '<td data-label="Trend" style="' + S.td + '">' + nameCell(e, target) + "</td>" +
      (withRing ? '<td data-label="Ring" style="' + S.td + '">' + chip("", b.ring) + " " + esc(b.ring.name) + "</td>" : "") +
      (hasSector
        ? '<td data-label="Sektor" style="' + S.td + '">' +
          (e.sector ? esc(e.sector.name) : '<span style="' + S.muted + '">–</span>') + "</td>"
        : "") +
      descCell(e) + "</tr>";
  }

  function renderLegendHTML(layout, mode) {
    var target = layout.links.target;
    var hasSector = !!(layout.wedges[0] && layout.wedges[0].sector);
    var blocks = [];

    if (mode === "flat") {
      var fk = legendColumns(hasSector, true);
      var frows = layout.blips.map(function (b) {
        return legendRow(b, hasSector, true, target);
      }).join("");

      blocks.push('<div class="tr-block" style="' + S.block + '"><table class="tr-table" style="' + S.table + '">' +
        colgroup(fk) + "<thead>" + headRow(fk) + "</thead><tbody>" + frows + "</tbody></table></div>");
    } else {
      var gk = legendColumns(hasSector, false);
      layout.bands.forEach(function (band) {
        var members = layout.blips.filter(function (b) { return b.ring.index === band.index; });
        if (!members.length) return;
        var rows = members.map(function (b) {
          return legendRow(b, hasSector, false, target);
        }).join("");

        blocks.push(
          '<section class="tr-ringblock" data-ring="' + esc(band.ring.id) + '" style="' + S.block + '">' +
            '<div class="tr-ringhead" style="' + S.ringHead + '">' + chip("", band.ring) +
            '<span class="tr-ringname" style="font-family:' + fontVar(layout.theme, true) +
            ';font-weight:700">' + esc(band.ring.name) + "</span>" +
            '<span class="tr-count" style="' + S.muted + ';font-size:0.85em">' + members.length + " Trends</span>" +
            (band.ring.description
              ? '<span class="tr-ringdesc" style="' + S.muted + ';flex:1 1 22ch;min-width:0">' + esc(band.ring.description) + "</span>"
              : "") +
            "</div>" +
            '<table class="tr-table" style="' + S.table + '">' + colgroup(gk) +
            "<thead>" + headRow(gk) + "</thead><tbody>" + rows + "</tbody></table>" +
          "</section>"
        );
      });
    }

    return '<div class="tr-legend" style="' + S.legend + '">' + blocks.join("") + "</div>";
  }


  /* ── 6. Kopfsatz ───────────────────────────────────────────────── */

  function renderHeadHTML(layout) {
    var bits = [];
    bits.push('<h1 class="tr-title" style="' + headTitleCss(layout.theme) + '">' + esc(layout.meta.title) + "</h1>");
    var meta = [];
    if (layout.meta.date) meta.push(esc(layout.meta.date));
    meta.push(layout.blips.length + " Trends");
    meta.push(layout.bands.length + " Ringe");
    if (layout.wedges.length && layout.wedges[0].sector) meta.push(layout.wedges.length + " Sektoren");
    if (layout.meta.subtitle) {
      bits.push('<span class="tr-sub" style="' + S.headMeta + ';flex:1 1 100%">' + esc(layout.meta.subtitle) + "</span>");
    }
    return bits.join("");
  }


  /* ── 7. Fehlerausgabe ──────────────────────────────────────────── */

  function renderErrorHTML(errors, warnings) {
    var html = '<div class="tr-error" style="' + S.errBox + '">';
    html += '<h2 style="margin:0 0 8px;font-size:1.1em">Trendradar kann nicht dargestellt werden</h2><ul style="margin:0 0 12px;padding-left:20px">';
    errors.forEach(function (e) { html += "<li>" + esc(e) + "</li>"; });
    html += "</ul>";
    if (warnings && warnings.length) {
      html += '<p style="margin:0 0 6px;font-weight:700">Hinweise</p><ul style="margin:0;padding-left:20px;color:var(--tr-muted,#495057)">';
      warnings.forEach(function (w) { html += "<li>" + esc(w) + "</li>"; });
    }
    html += "</div>";
    return html;
  }

  /* ── 8. DOM-Verkabelung (nur im Browser) ─────────────────────────── */

  function cssVars(theme) {
    return {
      "--tr-bg": theme.background,
      "--tr-ink": theme.ink,
      "--tr-muted": theme.muted,
      "--tr-grid": theme.grid,
      "--tr-sector-line": theme.sectorLine,
      "--tr-border": theme.border,
      "--tr-accent": theme.accent,
      "--tr-row-hover": theme.rowHover,
      /* Ohne diese beiden blieb "theme.font" und "theme.headSize" wirkungslos:
         die Regeln referenzieren nur die Variablen, niemand hat sie bisher
         gesetzt. */
      "--tr-font": theme.font,
      "--tr-head-font": theme.headFont,
      "--tr-font-size": theme.fontSize + "px",
      "--tr-blip-stroke": theme.blipStroke,
      "--tr-blip-stroke-width": theme.blipStrokeWidth + "px"
    };
  }

  /* Dieselben Variablen als Inline-Text fuer den statischen Build. Die
     Variablen erben auf alle Nachfahren, deshalb genuegt eine Zeile auf
     .tr-root - auch das SVG im Inneren zieht Schrift und Farben daraus. */
  function themeVarText(theme) {
    var v = cssVars(theme), out = "";
    Object.keys(v).forEach(function (k) { out += k + ":" + v[k] + ";"; });
    return out;
  }

  function mount(root, rawData) {
    if (!root) return null;
    var doc = root.ownerDocument || (typeof document !== "undefined" ? document : null);
    var win = doc && doc.defaultView ? doc.defaultView : (typeof window !== "undefined" ? window : null);
    var norm = validate(rawData);
    norm.warnings.forEach(function (w) { if (typeof console !== "undefined") console.warn("[Trendradar] " + w); });

    if (norm.errors.length) {
      var box = doc.createElement("div");
      box.innerHTML = renderErrorHTML(norm.errors, norm.warnings);
      while (root.firstChild) root.removeChild(root.firstChild);
      root.appendChild(box.firstChild);
      return null;
    }

    var layout = computeLayout(norm);

    /* Die Flaeche haengt am Wurzel-Element, das deckungsgleich 100dvh hoch
       ist. Beim Ueberziehen auf dem Handy wuerde darunter aber die weisse
       Browserflaeche durchscheinen - deshalb faerbt auch <body>. */
    if (doc && doc.body && layout.theme && layout.theme.background) {
      doc.body.style.background = layout.theme.background;
    }

    if (layout.overflow && typeof console !== "undefined") {
      console.warn("[Trendradar] " + layout.warnings[layout.warnings.length - 1]);
    }

    var head = root.querySelector(".tr-head");
    var stage = root.querySelector(".tr-stage");
    var legendWrap = root.querySelector(".tr-legend-wrap");
    var toolbar = root.querySelector(".tr-toolbar");
    var legendBox = root.querySelector(".tr-legend");

    /* Struktur hier und in build.js aus denselben Strings setzen. Steht hier
       kein Style, wandern die drei Bereiche ins automatische Raster, der
       Radar verliert seinen Platz und die Legende landet darunter. */
    if (head) head.style.cssText = S.head;
    if (stage) stage.style.cssText = S.stage;
    if (toolbar) toolbar.style.cssText = S.toolbar;
    if (legendBox) legendBox.style.cssText = S.legend;

    head.innerHTML = renderHeadHTML(layout);
    stage.innerHTML = renderSVG(layout);

    var mode = norm.layout.legend.mode;

    function paintLegend() {
      legendBox.innerHTML = renderLegendHTML(layout, mode);
      if (toolbar) {
        Array.prototype.forEach.call(toolbar.querySelectorAll(".tr-btn"), function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === mode ? "true" : "false");
        });
      }
      wireHighlight();
    }

    /* Tabelle ↔ Radar: Zeile oder Nummer markiert den Blip. */
    function wireHighlight() {
      var map = {};
      Array.prototype.forEach.call(stage.querySelectorAll(".tr-blip"), function (g) {
        map[g.getAttribute("data-nr")] = g;
      });
      Array.prototype.forEach.call(legendBox.querySelectorAll(".tr-row"), function (row) {
        function on() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.add("is-hl"); }
        function off() { var g = map[row.getAttribute("data-nr")]; if (g) g.classList.remove("is-hl"); }
        row.addEventListener("mouseenter", on);
        row.addEventListener("mouseleave", off);
      });
    }

    paintLegend();

    /* Umschalter gruppiert / flach */
    if (toolbar) {
      toolbar.style.cssText = S.toolbar;
      toolbar.innerHTML = '<span style="' + S.muted + ';font-size:0.85em;margin-right:auto">Legende</span>' +
        '<button type="button" class="tr-btn" data-mode="grouped">Gruppiert</button>' +
        '<button type="button" class="tr-btn" data-mode="flat">Flach</button>';
      toolbar.addEventListener("click", function (ev) {
        var btn = ev.target.closest ? ev.target.closest(".tr-btn") : null;
        if (!btn) return;
        mode = btn.getAttribute("data-mode") === "flat" ? "flat" : "grouped";
        paintLegend();
      });
    }

    /* Seitenraster: Kopf, Radar, Legende untereinander. Fest, ohne Messung
       und ohne Zustaendigkeit – die Legende liegt immer unter dem Radar,
       unabhaengig von der Rahmenbreite. */
    root.style.cssText = S.root + "border-radius:" + norm.theme.radius + "px";
    if (legendWrap) legendWrap.style.cssText = S.wrap;

    /* Theme als CSS-Variablen bereitstellen – so lässt sich das Design auch
       von aussen überschreiben, ohne die Datei anzufassen. */
    var vars = cssVars(norm.theme);
    Object.keys(vars).forEach(function (k) { root.style.setProperty(k, vars[k]); });

    return layout;
  }

  function readEmbeddedData(doc) {
    var el = doc.getElementById("trendradar-data");
    if (!el) return null;
    try {
      return JSON.parse(el.textContent || el.innerText || "{}");
    } catch (err) {
      if (typeof console !== "undefined") console.error("[Trendradar] JSON-Block ist ungültig: " + err.message);
      return { __parseError: err.message };
    }
  }

  function autoInit(doc) {
    doc = doc || (typeof document !== "undefined" ? document : null);
    if (!doc) return null;
    var root = doc.querySelector(".tr-root");
    if (!root) return null;
    var data = readEmbeddedData(doc);
    if (data && data.__parseError) {
      root.innerHTML = renderErrorHTML(["Der JSON-Block \"trendradar-data\" ist nicht gültiges JSON: " + data.__parseError], []);
      return null;
    }
    return mount(root, data);
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { autoInit(); });
    else autoInit();
  }

  return {
    TAU: TAU,
    STYLE: S,
    validate: validate,
    computeLayout: computeLayout,
    renderSVG: renderSVG,
    renderLegendHTML: renderLegendHTML,
    renderHeadHTML: renderHeadHTML,
    renderErrorHTML: renderErrorHTML,
    cssVars: cssVars,
    themeVarText: themeVarText,
    mount: mount,
    autoInit: autoInit,
    readEmbeddedData: readEmbeddedData
  };
})();

if (typeof globalThis !== "undefined") globalThis.TrendRadar = TrendRadar;
if (typeof module !== "undefined" && module.exports) module.exports = TrendRadar;
</script>
</body>
</html>
